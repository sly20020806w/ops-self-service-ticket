server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8080/api/;
  }
  location /healthz {
    proxy_pass http://api:8080/healthz;
  }
  location /metrics {
    proxy_pass http://api:8080/metrics;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
