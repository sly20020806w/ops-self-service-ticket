services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DB_PATH: /app/data/ticket.db
      SEED_DEMO: "true"
      JWT_SECRET: change-me-in-production
      # NOTIFY_WEBHOOK: https://your.webhook.url
    volumes:
      - ticket-data:/app/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  ticket-data:
