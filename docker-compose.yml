services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ticket-data:/app/data
    environment:
      CONFIG_PATH: /app/configs/config.yaml

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  ticket-data:
